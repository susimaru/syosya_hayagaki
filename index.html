<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>硬筆書写検定 第一問 速書きタイマー</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
      color: #111;
      font-family: "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    main { text-align: center; }
    #timer {
      margin: 0 0 36px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: clamp(4.5rem, 20vw, 11rem);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 1;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 46px;
      background: #111;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 1.25rem;
      font-weight: 700;
    }
    button:hover:not(:disabled) { background: #333; }
    button:focus-visible { outline: 3px solid #4b8df8; outline-offset: 3px; }
    button:disabled { background: #a6a6a6; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <p id="timer" aria-live="off">00:00</p>
    <button id="start" type="button">開始</button>
  </main>

  <audio id="audio-1" preload="auto" src="audio-1.mp3"></audio>
  <audio id="audio-2" preload="auto" src="audio-2.mp3"></audio>
  <audio id="audio-3" preload="auto" src="audio-3.mp3"></audio>
  <audio id="audio-4" preload="auto" src="audio-4.mp3"></audio>
  <audio id="audio-5" preload="auto" src="audio-5.mp3"></audio>
  <audio id="audio-6" preload="auto" src="audio-6.mp3"></audio>

  <script>
    const startButton = document.getElementById('start');
    const timer = document.getElementById('timer');
    const audio = [1, 2, 3, 4, 5, 6].map(number => document.getElementById(`audio-${number}`));

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function setTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      timer.textContent = `${String(minutes).padStart(2, '0')}:${String(remainder).padStart(2, '0')}`;
    }

    function runTimer(durationSeconds) {
      return new Promise(resolve => {
        const startedAt = performance.now();
        const tick = now => {
          const elapsed = Math.min(durationSeconds, Math.floor((now - startedAt) / 1000));
          setTime(elapsed);
          if (elapsed >= durationSeconds) {
            resolve();
            return;
          }
          requestAnimationFrame(tick);
        };
        setTime(0);
        requestAnimationFrame(tick);
      });
    }

    function playAudio(track) {
      return new Promise((resolve, reject) => {
        track.pause();
        track.currentTime = 0;
        const finish = () => {
          track.onended = null;
          track.onerror = null;
          resolve();
        };
        const fail = () => {
          track.onended = null;
          track.onerror = null;
          reject(new Error('音声ファイルを再生できませんでした。'));
        };
        track.onended = finish;
        track.onerror = fail;
        track.play().catch(fail);
      });
    }

    async function startExam() {
      startButton.disabled = true;
      setTime(0);
      try {
        await playAudio(audio[0]);
        await wait(3000);
        await playAudio(audio[1]);
        await runTimer(60);
        await playAudio(audio[2]);
        await wait(2000);
        await playAudio(audio[3]);
        await wait(3000);
        await playAudio(audio[4]);
        await runTimer(240);
        await playAudio(audio[5]);
        setTime(0);
      } catch (error) {
        console.error(error);
        alert('音声ファイルを再生できませんでした。GitHub Pagesに audio-1.mp3 ～ audio-6.mp3 をアップロードしているか確認してください。');
      } finally {
        startButton.disabled = false;
      }
    }

    startButton.addEventListener('click', startExam);
  </script>
</body>
</html>
